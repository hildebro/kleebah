name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # NEW: Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Uses the latest version 9

      # Setup Node (and enable pnpm caching)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # CHANGED: Use pnpm to install deps strictly
      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      # We continue to use 'npx' here because it works reliably
      # for one-off tool execution without polluting your pnpm setup.
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx \
          -p semantic-release \
          -p @semantic-release/git \
          -p @semantic-release/changelog \
          semantic-release